name: Build and release extension

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'config.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('config.json','utf8')).latestVersion")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Detect packaged artifact
        id: artifact
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          PART_DIR="dist/v${VERSION}"
          if compgen -G "$PART_DIR/part-*.b64" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No packaged artifact for v${VERSION}; release step skipped."
          fi

      - name: Decode extension ZIP
        if: steps.artifact.outputs.exists == 'true'
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          PART_DIR="dist/v${VERSION}"
          OUT="mudream-trader-v${VERSION}.zip"
          cat "$PART_DIR"/part-*.b64 | base64 -d > "$OUT"
          unzip -t "$OUT"

      - name: Validate packaged JavaScript and manifest
        if: steps.artifact.outputs.exists == 'true'
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          rm -rf _release_check && mkdir _release_check
          unzip -q "mudream-trader-v${VERSION}.zip" -d _release_check
          node --check _release_check/content.js
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('_release_check/manifest.json','utf8')); const c=JSON.parse(fs.readFileSync('config.json','utf8')); if(m.version!==c.latestVersion) throw new Error('manifest.version != config.latestVersion')"

      - name: Create or update GitHub Release
        if: steps.artifact.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          ASSET="mudream-trader-v${VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "MuDream Trader v${VERSION}" \
              --generate-notes
          fi
